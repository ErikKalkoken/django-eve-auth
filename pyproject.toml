[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "django-eve-auth"
dynamic = ["version", "description"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "~=3.7"
authors = [{ name = "Erik Kalkoken", email = "kalkoken87@gmail.com" }]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = ["django-esi>=4,<5", "Django>=3"]

[project.urls]
Documentation = "https://django-eve-auth.readthedocs.io/en/latest/"
Source = "https://gitlab.com/ErikKalkoken/django-eve-auth"
Changelog = "https://gitlab.com/ErikKalkoken/django-eve-auth/-/blob/master/CHANGELOG.md"
Tracker = "https://gitlab.com/ErikKalkoken/django-eve-auth/-/issues"

[tool.flit.module]
name = "eve_auth"
